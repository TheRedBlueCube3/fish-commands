# Rules
rules.1 = # 1: [#FF3F3F]No griefing. This refers to intentionally hurting your own team in any way.
rules.2 = # 2: [orange]False votekicking isn't allowed. Avoid votekicking if there's an active staff member in the server.
rules.3 = # 3: [yellow]Treat beginners with politeness, this is not a ranked server.
rules.4 = # 4: [#3FFF3F]Gore, pornography, suggestive content and jokes, and flashing images aren't allowed here. Being horny and a creep in chat will result in a ban.
rules.5 = # 5: [#3FFFBF]Do not harass other people. We have zero tolerance for any bigotry. Please respect everyone.
rules.6 = # 6: [#3FBFFF]Spamming is prohibited. Be reasonable with messaging staff in-game. Misuse may result in a mute.
rules.7 = # 7: [#3F3FFF]Impersonating people or ranks is prohibited.
rules.8 = # 8: [#BF3FFF]Talking about controversial or sensitive topics is not allowed in-game. Hate symbols, such as swastikas, are not permitted.
rules.9 = # 9: [#FF3FBF]Do not ragebait people. If someone tells you they are uncomfortable, respect it.
rules.failure = Failure to follow these rules may result in a {0} tag blocking you from playing, a mute for broken chat rules, and bans for repeated offenses or bypasses.

