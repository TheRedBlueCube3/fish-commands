# Ads for Fish Membership
tip.ads.pets = [pink]Fish Membership[] subscribers can access the [pink]/pet[] command, which spawns a merui that follows you around. Get a Fish membership at [sky] {0} []
tip.ads.highlight = [pink]Fish Membership[] subscribers can use the [pink]/highlight[] command, which turns your chat messages to a color of your choice. Get a Fish membership at [sky] {0} []
tip.ads.rainbow = [pink]Fish Membership[] subscribers can use the [pink]/rainbow[] command, which makes your name flash different colors. Get a Fish membership at [sky] {0} []
tip.ads.support = Want to support the server and get some perks? Get a [pink]Fish Membership[] at[sky] {0} []
tip.ads.discord = Join our [#7289DA]Discord server[]! [#7289DA]https://discord.gg/VpzcYSQ33Y[] or type [#7289DA]/discord[]

# Tips
tip.normal.ohno = You can spawn an [scarlet]Ohno[] with the [scarlet]/ohno[] command. Ohnos are harmless creatures that were created by fusing an alpha and an atrax.
tip.normal.ohnonospawn = Ohnos cannot be spawned near enemy buildings, because they are peaceful and do not want to be used for attacks.
tip.normal.usetp = You can use [white]/tp[] to teleport directly to any other player! (But only when you're in a core unit)
tip.normal.conveyors = You can unload bulk conveyors ( or ) with unloaders ( or ).
tip.normal.boulders = Hate boulders? You can remove them with [white]/clean[].
tip.normal.rules = You can check our rules at any time by running [white]/rules[].
tip.normal.tilelog = We have a tilelog system to help catch griefers. Run [white]/tilelog[], then click a tile to see what's happened there.
tip.normal.tilelog2 = Run [white]/tilelog 1[] to check the tile history of multiple tiles.
tip.normal.tilelog3 = Tilelog stores when a building is placed, broken, rotated, configured, and picked up/dropped by a payload unit. Access it with [white]/tilelog[]!
tip.normal.tilelog4 = Tilelog doesn't just log tile actions, it also logs unit deaths! Access it with [white]/tilelog[]
tip.normal.aoelog = Did someone kill a T5 with commands? Run [white]/aoelog 0 15 killed[] to check tilelogs for unit deaths in a large area.
tip.normal.aoelog2 = Aoelog can show the history of tiles in an area. Select the opposite corners of a rectangle to view the history of its tiles.
tip.normal.aoelog3 = Aoelog is the plural version of tilelog, access it via [white]/aoelog[]
tip.normal.translation = You can run [white]/language[] to change your translation language.
tip.normal.afk = You can mark yourself as AFK(away from keyboard) with [white]/afk[].
tip.normal.serverchange = Run /survival, /attack, /pvp, /sandbox, /hexed or /minigame to quickly change to another server.
tip.normal.staff = Need to get rid of an active griefer? Use [#6FFC7C]/s[] to send a message to all staff members across all servers.
tip.normal.help = Use [white]/help to get more information about a specific command.
tip.normal.whisper = If you want to send a message to just one player, you can use the [white]/msg[] command.
tip.normal.reply = Use [white]/r[] to reply to a message sent by another player.
tip.normal.trail = [white]/trail[] can be used to give your unit a trail of particle effects.
tip.normal.ranks = Run [white]/ranks[] to see all the ranks on our server.
tip.normal.impersonator = Is someone impersonating a staff member? Run [white]/rank[] to see their real rank.
tip.normal.rtv = Don't like the map? Vote to change it with [white]/rtv[].
tip.normal.rtv2 = If you want to end the current map, DO NOT BREAK DEFENCES! Vote to change the map with [white]/rtv[].
tip.normal.impersonator2 = Anyone attempting to impersonate a ranked player, or the server, will have [scarlet]SUSSY IMPOSTOR[] prepended to their name. Beware!
tip.normal.griefer = Griefers will often be found with the text [yellow]\u26A0[scarlet]Marked Griefer[]\u26A0[] prepended to their name: they are harmless and cannot grief again.
tip.normal.novkgrief = Don't votekick [yellow]\u26A0[scarlet]Marked Griefer[][scarlet]s [gold]if they aren't breaking the rules: they are incapable of griefing more.
tip.normal.suspicious = Players marked as [yellow]\u26A0[orange]Flagged[]\u26A0[] have been flagged as suspicious by our detection systems, but they may not be griefers.
tip.normal.appeal = Need to appeal a moderation action? Join the discord at https://discord.gg/VpzcYSQ33Y or type /discord
tip.normal.command = Want to send the phrase [white]"/command"[] in chat? Type [white]"./command"[] and the [white].[] will be removed.
tip.normal.playermenu = All commands with a player as an argument support using a menu to specify the player. Just run the command leaving the argument blank (using two spaces if necessary), and a menu will show up.
tip.normal.trusted = Players with a [black]<[#E67E22]\uE813[]>[] in front of their name aren't staff members, but they do have extra powers.
tip.normal.staffprefix = Staff members will have the following prefixes in front of their name: [black]<[#6FFC7C]\uE817[]>[], [black]<[cyan]\uE82C[]>[], [black]<[scarlet]\uE88E[]>[].
tip.normal.vnw = Wave cooldown too long? Skip the wait with [white]/vnw[]
tip.normal.novoids = You can tell new players not to break power voids with [white]/void[].
tip.normal.colortags = You can add [pink]color[] to things with color tags! Try typing "[[{0}]Hello" in chat, and see what happens!

# Christmas splash text
tip.christmas.nice = Remember to be nice in-game, Santa is watching!
tip.christmas.nicelist = Santa's checking his list, so be nice!
tip.christmas.merrychristmas = Have a merry Christmas and a Happy New Year!
tip.christmas.fishjolly = Fish becomes a bit more jolly around Christmastime!
tip.christmas.mapchange = Many server maps have been changed for the season.

