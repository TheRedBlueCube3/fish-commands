# Ads for Fish Membership
tip.ads.pets = [pink]Подписчики Fish[] имеют команду [pink]/pet[], создающую меруя, который за ними следует. Поддержите сервер, переходя по этой ссылке: [sky] {0} []
tip.ads.highlight = [pink]Подписчики Fish[] имеют команду [pink]/highlight[], которая превращает их сообщения в любой цвет. Поддержите сервер, переходя по этой ссылке: [sky] {0} []
tip.ads.rainbow = [pink]Подписчики Fish[] имеют команду [pink]/rainbow[], которая заставляет ваше имя менять цвета, как радуга. Поддержите сервер, переходя по этой ссылке: [sky] {0} []
tip.ads.support = Хотите поддержать сервер и получить несколько приятных сюрпризов? Переходите по этой ссылке, чтобы подписаться: [sky] {0} []
tip.ads.discord = Заходите на наш [#7289DA]дискорд сервер[]! Переходите по ссылке [#7289DA]https://discord.gg/VpzcYSQ33Y[] или напишите [#7289DA]/discord[] в чат.

# Tips
tip.normal.ohno = Вы можете создавать [scarlet]единицы ohno[] с помощью команды [scarlet]/ohno[]. Эти единицы - безобидные существа, которые были созданы смешиванием альф и атраксов.
tip.normal.ohnonospawn = Ohno нельзя призывать рядом с вражескими постройками, потому что они мирные и не будут атаковать.
tip.normal.usetp = Вы можете телепортироваться к любому другому игроку командой [white]/tp[]! (Но только когда вы в единице от ядра)
tip.normal.conveyors = Вы можете разгружать кучные конвейеры ( or ) с помощью разгрузчиков. ( or ).
tip.normal.boulders = Что, вам камушки надоели? Тогда уберите их с помощью команды [white]/clean[].
tip.normal.rules = Вы можете в любой момент взглянуть на правила сервера командой [white]/rules[].
tip.normal.tilelog = У нас есть система логов блоков, чтобы легче поймать гриферов. Напишите команду [white]/tilelog[], затем кликните на любой блок.
tip.normal.tilelog2 = Напишите [white]/tilelog 1[], чтобы посмотреть на историю сразу нескольких блоков.
tip.normal.tilelog3 = Лог блоков сохраняет информацию о любом, что может произойти с ним. Посмотрите с помощью [white]/tilelog[]!
tip.normal.tilelog4 = Лог блоков не только сохраняет информацию о них, так он еще сохраняет информацию о смерти единиц. Посмотрите с помощью [white]/tilelog[]!
tip.normal.aoelog = Кто это убил единственного T5? Напишите [white]/aoelog 0 15 killed[], чтобы посмотреть смерти единиц в большом радиусе и найти этого проказника.
tip.normal.aoelog2 = Команда [white]/aoelog[] умеет показывать историю блоков немалой площади. Выделите углы прямоугольника и всё будет готово.
tip.normal.aoelog3 = Лог AOE - это как множественная версия команды [white]/tilelog[]. Попробуйте эту команду - [white]/aoelog[]!
tip.normal.translation = Вы можете написать [white]/language[], чтобы сменить язык перевода чата.
tip.normal.afk = Вы можете отметить себя как АФК, используя команду [white]/afk[].
tip.normal.serverchange = Напишите команды /survival, /attack, /pvp, /sandbox, /hexed, или /minigame, чтобы быстро смениться на другой сервер.
tip.normal.staff = У вас грифер на базе? Используйте команду [#6FFC7C]/s[], чтобы отправить сообщение всей администрации по всем серверам.
tip.normal.help = Используйте [white]/help, чтобы получить побольше информации про одну команду.
tip.normal.whisper = Хотите отправить кому-то сообщение в ЛС? Для этого подходит команда [white]/msg[].
tip.normal.reply = Используйте команду [white]/r[], чтобы ответить сообщению от другого игрока.
tip.normal.trail = Команда [white]/trail[] даст вашей единице след, какой хотите!
tip.normal.ranks = Напишите [white]/ranks[], чтобы увидеть все роли на нашем сервере.
tip.normal.impersonator = Если кто-то выдаёт себя за администрацию, вы можете написать [white]/rank[], чтобы увидеть их настоящую роль.
tip.normal.rtv = Не нравится карта? Напишите [white]/rtv[].
tip.normal.rtv2 = Если хотите сменить карту, НЕ ЛОМАЙТЕ ЗАЩИТУ! Просто используйте команду [white]/rtv[].
tip.normal.impersonator2 = Любой человек, который пытается выдать себя за другого, будет иметь тег [scarlet]SUSSY IMPOSTOR[] (Самозванец) перед именем. Будьте бдительны!
tip.normal.griefer = Гриферы обычно найдутся с тегом [yellow]\u26A0[scarlet]Marked Griefer[]\u26A0[] (Пойманный грифер) перед именем; они и так безобидные, они дальше ничего не смогут сделать.
tip.normal.novkgrief = Не кикайте [yellow]\u26A0[scarlet]Пойманных гриферов[yellow]\u26A0[] [gold]если они соблюдают правила; они и так больше не смогут гриферить.
tip.normal.suspicious = Игроки с тегом [yellow]\u26A0[orange]Flagged[]\u26A0[] (Помеченный) перед именем были помечены нашими системами, но они могут не быть гриферами.
tip.normal.appeal = Нужно аппелировать бан, мут или помечение? Зайдите на наш дискорд по ссылке https://discord.gg/VpzcYSQ33Y или напишите /discord.
tip.normal.command = Хотите отправить [white]"/command"[] в чат? Просто напишите [white]"./command"[] и [white]точка[] будет убрана.
tip.normal.playermenu = Все команды, у которых аргумент - игрок, поддерживают выбор через меню. Просто напишите команду без аргумента (с двумя пробелами, если нужно) и появится меню игроков.
tip.normal.trusted = Игроки с [black]<[#E67E22]\uE813[]>[] перед именем - не администрация, но у них есть дополнительные полномочия.
tip.normal.staffprefix = У администрации будут следующие префиксы перед именем: [black]<[#6FFC7C]\uE817[]>[], [black]<[cyan]\uE82C[]>[], [black]<[scarlet]\uE88E[]>[].
tip.normal.vnw = Надоело ждать новую волну? Пропустите с помощью команды /vnw.
tip.normal.novoids = Вы можете рассказать игрокам о энергетических вакуумах с помощью команды [white]/void[].
tip.normal.colortags = Вы можете добавить [pink]цвет[] к сообщениям с помощью цветных тегов! Попробуйте - напишите "[[{0}]Привет" в чат и посмотрите результат.

# Christmas splash text
tip.christmas.nice = Будьте добры в игре, ведь Дед Мороз за всеми наблюдает!
tip.christmas.nicelist = Дед Мороз проверяет список добрых и злых для подарков, поэтому будьте любезны!
tip.christmas.merrychristmas = Поздравляем всех с Наступающим Новым Годом!
tip.christmas.fishjolly = На рыбочке всегда повеселее с приближающимся Новым Годом!
tip.christmas.mapchange = Несколько карт на сервере были изменены в связи с праздниками.

tip.prefix = [gold]Совет: {0}[]

# Rules
rules.1 = # 1: [#FF3F3F]Не гриферить. Это означает не пытаться нарочно повредить своей команде.
rules.2 = # 2: [orange]Ложное голосование за кик не допускается. Не голосуйте, если на сервере есть член администрации.
rules.3 = # 3: [yellow]Treat beginners with politeness, this is not a ranked server.
rules.4 = # 4: [#3FFF3F]Кровавые сцены, порнография, соблазнительный контент и шутки и мигающиеся картинки тут не разрешены. Если вы будете странно себя вести и будете возбужденными, это "награждается" баном.
rules.5 = # 5: [#3FFFBF]Не оскорбляйте других людей. Любая ненависть любой группы никогда не сходит с рук. Пожалуйста, уважайте всех.
rules.6 = # 6: [#3FBFFF]Спам запрещён. Будьте любезны с сообщениями членам администрации. Злоупотребление сообщениями администрации карается мутом.
rules.7 = # 7: [#3F3FFF]Выдавать себя за другого человека или ранг запрещено.
rules.8 = # 8: [#BF3FFF]Разговоры про спорные или обидчивые темы запрещено в игре. Символы ненависти, например свастики, или числа с историческим подтекстом не разрешены.
rules.9 = # 9: [#FF3FBF]Не тролльте других игроков. Если кто-то скажет вам, что им некомфортно, уважайте это чувство.
rules.failure = Несоблюдение этих правил может окончится флагом {0}, оставляя вас , a mute for broken chat rules, and bans for repeated offenses or bypasses.

# Welcome messages
welcome.appeal = Чтобы аппелировать, [#7289DA]зайдите на наш дискорд-сервер[] командой [#7289DA]/discord[] или спросите {0}администратора[].
welcome.marked = [gold]Здравствуйте! Вы ныне [scarlet]помечены как грифер[]. Пока вы помечены, вы ничего не сможете сделать в игре.\n{0}\nВаше помечение автоматически истечёт {1}.\nМы извиняемся за принесённые нами неудобства.
welcome.muted = [gold]Здравствуйте! На вас действует [red]мут[]. Вы можете играть как обычно, но не можете отправлять сообщения в чат игрокам, которые не являются администраторами.\n{0}\nВаш мут автоматически истечёт {1}.\nМы извиняемся за принесённые нами неудобства.
welcome.flagged = [gold]Здравствуйте! Вы ныне [red]помечены как подозрительный(-ая)[]. Вы ничего не сможете сделать в игре.\n{0}\nМы извиняемся за принесённые нами неудобства.
welcome.vanished = [gold]Здравствуйте! Ваш префикс скрытый. Вы можете снова его показать, написав команду [white]/vanish[].
welcome = [gold]Добро пожаловать![]
dataFetchFailed = [scarlet]\u26A0 Не удалось скачивание данных с сервера!\n[white]Если у вас пропали статистики, пропал ранг и т.п. - перезайдите.

